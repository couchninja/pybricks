name: Lint

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          cache: true

      - name: Ruff check
        run: pixi run ruff check

      - name: Ruff format
        run: pixi run ruff format --check

      - name: Install web viewer npm dependencies
        run: pixi run web-viewer-install

      - name: Prettier (web viewer)
        run: pixi run web-viewer-format-check

  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          cache: true

      - name: Ty check
        run: pixi run ty check
