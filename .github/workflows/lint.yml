name: Lint

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          cache: true

      - name: Ruff check
        run: pixi run ruff check

      - name: Ruff format
        run: pixi run ruff format --check

  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          cache: true

      - name: Ty check
        run: pixi run ty check
