[tool.ruff]
line-length = 120
target-version = "py313"
# This might change the code intent on save: see how it treats us
unsafe-fixes = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "ANN201"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
unresolved-import = "ignore"

[tool.ty.terminal]
error-on-warning = true
