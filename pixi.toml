[workspace]
channels = ["conda-forge"]
name = "pybricks"
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
version = "0.1.0"

[tasks]
run = "pybricksdev run ble pybricks/main.py"

[dependencies]
micropython = ">=1.28.0,<2"
python = ">=3.13,<3.14"

[pypi-dependencies]
pybricks = "==4.0.0"
pybricksdev = "==2.3.2"
