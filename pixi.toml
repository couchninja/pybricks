[workspace]
channels = ["conda-forge"]
name = "pybricks"
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64", "linux-aarch64"]
version = "0.1.0"

[activation]
env = { PYTHONPATH = "." }

[tasks]
astronomy-viewer = "python simulate/astronomy/viewer.py"
astronomy-viewer-watch = "python -m watchfiles --filter python \"python simulate/astronomy/viewer.py\" simulate/astronomy/"
navigator = "python navigator/navigator_main.py"
motion-range = "python navigator/motion_range_main.py"
hub-run = "python pybricks_client/ble_control.py run pybricks_hub/main.py --no-wait"
hub-dev = "pybricksdev run ble pybricks_hub/main.py --stay-connected"
ble-scan = "python pybricks_client/ble_control.py scan"
hub-stop = "python pybricks_client/ble_control.py stop"
hub-upload = "python pybricks_client/ble_control.py download pybricks_hub/main.py"
test-hub = "python pybricks_client/test_hub.py"

precommit = "pre-commit run --all-files"
precommit-install = "pre-commit install"
# Survives reboot
bluetooth-off = "sudo systemctl disable --now bluetooth"
bluetooth-on = "sudo systemctl enable --now bluetooth"
# Does not survice reboot
wifi-off = "sudo nmcli radio wifi off"
wifi-on = "sudo nmcli radio wifi on"
wifi-list = "nmcli -f NAME,UUID,TYPE,DEVICE,STATE,AUTOCONNECT,AUTOCONNECT-PRIORITY connection"

[dependencies]
micropython = ">=1.28.0,<2"
python = ">=3.13,<3.14"

[pypi-dependencies]
# Host-side API stubs for editing hub programs (Color, Port, etc.).
pybricks = "==4.0.0"
pybricksdev = "==2.3.2"
trimesh = ">=4.0"
scipy = ">=1.18.0"
pyglet = ">=1.5.31,<2.0"
astropy = ">=7.0"
pre-commit = ">=4.0"
ruff = "==0.14.14"
ty = "==0.0.14"
watchfiles = ">=1.0"

[target.linux.pypi-dependencies]
gpiod = ">=2.5.0, <3"


# pybricks-ble depends on an old pybricks-api git commit (3.6.1). Without this
# override, pixi cannot install pybricks 4.0.0 from PyPI alongside pybricks-ble.
# pybricks_client/pb_ble_import.py works around pybricks-ble's broken __init__ on 4.x.
[pypi-options.dependency-overrides]
pybricks = "==4.0.0"
