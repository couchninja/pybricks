[workspace]
channels = ["conda-forge"]
name = "pybricks"
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64", "linux-aarch64"]
version = "0.1.0"

[activation]
env = { PYTHONPATH = "." }

[tasks]
run = "python scripts/ble_control.py run pybricks/main.py --no-wait"
dev = "pybricksdev run ble pybricks/main.py --stay-connected"
scan = "python scripts/ble_control.py scan"
stop = "python scripts/ble_control.py stop"
upload = "python scripts/ble_control.py download pybricks/main.py"
test = "python scripts/test_hub.py"
motionrange = "python hub_client/starpoint/motion_range_main.py"
#starpoint = "python hub_client/starpoint/star_point_main.py"
visualize = "python simulate/astronomy/visualization.py"
visualize-watch = "python -m watchfiles --filter python \"python simulate/astronomy/visualization.py\" simulate/astronomy/"
precommit = "pre-commit run --all-files"
precommit-install = "pre-commit install"
# Survives reboot
bluetooth-off = "sudo systemctl disable --now bluetooth"
bluetooth-on = "sudo systemctl enable --now bluetooth"
# Does not survice reboot
wifi-off = "sudo nmcli radio wifi off"
wifi-on = "sudo nmcli radio wifi on"

wifi-list = "nmcli -f NAME,UUID,TYPE,DEVICE,STATE,AUTOCONNECT,AUTOCONNECT-PRIORITY connection"
starpoint = "sudo env PYTHONPATH=. .pixi/envs/default/bin/python hub_client/starpoint/star_point_main.py"

[dependencies]
micropython = ">=1.28.0,<2"
python = ">=3.13,<3.14"

[pypi-dependencies]
# Host-side API stubs for editing hub programs (Color, Port, etc.).
pybricks = "==4.0.0"
pybricksdev = "==2.3.2"
trimesh = ">=4.0"
scipy = ">=1.18.0"
pyglet = ">=1.5.31,<2.0"
astropy = ">=7.0"
pre-commit = ">=4.0"
ruff = "==0.14.14"
ty = "==0.0.14"
watchfiles = ">=1.0"

[target.linux.pypi-dependencies]
gpiod = ">=2.5.0, <3"


# pybricks-ble depends on an old pybricks-api git commit (3.6.1). Without this
# override, pixi cannot install pybricks 4.0.0 from PyPI alongside pybricks-ble.
# hub_client/pb_ble_import.py works around pybricks-ble's broken __init__ on 4.x.
[pypi-options.dependency-overrides]
pybricks = "==4.0.0"
